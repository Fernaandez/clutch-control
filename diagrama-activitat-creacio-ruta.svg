<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .text { font: 600 22px Arial, sans-serif; fill: #111827; }
      .small { font: 500 18px Arial, sans-serif; fill: #111827; }
      .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .line { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .startend { fill: #111827; stroke: #111827; stroke-width: 3; }
      .endouter { fill: none; stroke: #111827; stroke-width: 3; }
      .label { font: 600 17px Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#ffffff"/>
  <text x="600" y="65" text-anchor="middle" class="title">Diagrama d'activitat - Creaci� d'una ruta</text>

  <!-- Start -->
  <circle cx="600" cy="130" r="24" class="startend"/>
  <line x1="600" y1="154" x2="600" y2="215" class="line"/>

  <!-- Nodes -->
  <rect x="370" y="215" width="460" height="80" rx="22" class="node"/>
  <text x="600" y="263" text-anchor="middle" class="text">Entrar a l'apartat de rutes</text>
  <line x1="600" y1="295" x2="600" y2="365" class="line"/>

  <rect x="370" y="365" width="460" height="80" rx="22" class="node"/>
  <text x="600" y="413" text-anchor="middle" class="text">Seleccionar crear ruta</text>
  <line x1="600" y1="445" x2="600" y2="515" class="line"/>

  <rect x="330" y="515" width="540" height="90" rx="22" class="node"/>
  <text x="600" y="552" text-anchor="middle" class="text">Introduir dades generals</text>
  <text x="600" y="582" text-anchor="middle" class="small">t�tol, descripci�, dificultat i moto</text>
  <line x1="600" y1="605" x2="600" y2="675" class="line"/>

  <rect x="330" y="675" width="540" height="90" rx="22" class="node"/>
  <text x="600" y="714" text-anchor="middle" class="text">Marcar punts al mapa</text>
  <text x="600" y="744" text-anchor="middle" class="small">waypoints de sortida i pas</text>
  <line x1="600" y1="765" x2="600" y2="835" class="line"/>

  <polygon points="600,835 760,925 600,1015 440,925" class="decision"/>
  <text x="600" y="918" text-anchor="middle" class="text">Dades correctes?</text>
  <text x="600" y="948" text-anchor="middle" class="small">validaci� del sistema</text>

  <!-- No path -->
  <line x1="440" y1="925" x2="230" y2="925" class="line"/>
  <text x="330" y="900" text-anchor="middle" class="label">No</text>
  <rect x="70" y="885" width="160" height="80" rx="22" class="node"/>
  <text x="150" y="918" text-anchor="middle" class="small">Mostrar errors</text>
  <text x="150" y="943" text-anchor="middle" class="small">al formulari</text>
  <path d="M150 885 L150 560 L330 560" class="line"/>

  <!-- Yes path -->
  <line x1="600" y1="1015" x2="600" y2="1085" class="line"/>
  <text x="632" y="1055" class="label">S�</text>

  <rect x="330" y="1085" width="540" height="90" rx="22" class="node"/>
  <text x="600" y="1122" text-anchor="middle" class="text">Guardar ruta a la base de dades</text>
  <text x="600" y="1152" text-anchor="middle" class="small">i guardar els punts associats</text>
  <line x1="600" y1="1175" x2="600" y2="1245" class="line"/>

  <polygon points="600,1245 760,1325 600,1405 440,1325" class="decision"/>
  <text x="600" y="1318" text-anchor="middle" class="text">Ruta p�blica?</text>
  <text x="600" y="1348" text-anchor="middle" class="small">comunitat o privada</text>

  <line x1="440" y1="1325" x2="280" y2="1325" class="line"/>
  <text x="365" y="1300" text-anchor="middle" class="label">No</text>
  <rect x="80" y="1285" width="200" height="80" rx="22" class="node"/>
  <text x="180" y="1318" text-anchor="middle" class="small">Guardar a</text>
  <text x="180" y="1343" text-anchor="middle" class="small">les meves rutes</text>

  <line x1="760" y1="1325" x2="920" y2="1325" class="line"/>
  <text x="835" y="1300" text-anchor="middle" class="label">S�</text>
  <rect x="920" y="1285" width="210" height="80" rx="22" class="node"/>
  <text x="1025" y="1318" text-anchor="middle" class="small">Mostrar tamb�</text>
  <text x="1025" y="1343" text-anchor="middle" class="small">a la comunitat</text>

  <!-- End join -->
  <path d="M180 1365 L180 1440 L600 1440" class="line"/>
  <path d="M1025 1365 L1025 1440 L600 1440" class="line"/>
  <circle cx="600" cy="1440" r="28" class="endouter"/>
  <circle cx="600" cy="1440" r="18" class="startend"/>
</svg>
