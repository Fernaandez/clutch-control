<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sense connexió — Clutch Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 2rem;
            max-width: 20rem;
        }
        button {
            background-color: #fafafa;
            color: #0a0a0a;
            border: none;
            padding: 0.9rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.85rem;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }
        button:active { opacity: 0.85; }
    </style>
</head>
<body>
    <h1>Sense connexió</h1>
    <p>Clutch Control necessita internet per obrir-se. Si estaves gravant una ruta, es continua guardant en local. Connecta’t per sincronitzar.</p>
    <button type="button" onclick="window.location.href = 'https://clutchcontrol.es/'">
        Reintentar
    </button>
</body>
</html>
